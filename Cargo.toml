[package]
name = "cromoforge"
version = "0.1.2"

edition = "2021"
license = "Apache-2.0"
description = "Deploy agent for SecuryBlack — pulls an OCI image and reconciles a server's running container against a desired state"
repository = "https://github.com/securyblack/cromo-forge"

[dependencies]
sb-agent-core = { git = "https://github.com/securyblack/sb-agent-core", branch = "master" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
